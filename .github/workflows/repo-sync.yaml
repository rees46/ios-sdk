name: Repository synchronization

# Triggered by the release commit itself rather than by the completion of the
# `Bump version` workflow. That workflow completes on every push to master — once
# for the change, once again for the release commit it pushes itself — and each
# completion used to start a synchronization, so a single release arrived in the
# mirror as two PRs carrying the same version, and the mirror published it twice.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  prepare:
    if: |
      !contains(github.repository_owner, 'personaclick') &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    outputs:
      replacements: ${{ steps.getReplacementsStep.outputs.replacements }}
    steps:
      - uses: rees46/workflow/.github/actions/sync/read-replacements@master
        id: getReplacementsStep
        with:
          appId: ${{ vars.PUBLIVERSIONER_ID }}
          appSecret: ${{ secrets.PUBLIVERSIONER_SECRET }}
          replacementsPath: github/repo-sync-replacements/ios-sdk.yml

  repoSync:
    needs: prepare
    uses: rees46/workflow/.github/workflows/reusable-repo-sync.yml@master
    secrets:
      appSecret: ${{ secrets.PERSONACLICK_COURIER_SECRET }}
    with:
      appId: ${{ vars.PERSONACLICK_COURIER_ID }}
      replacements: ${{ needs.prepare.outputs.replacements }}
      targetRepository: personaclick/ios-sdk
      repositoryOwner: personaclick
      reviewerUsername: ${{ vars.REVIEWER_USERNAME }}
